<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Collections — Company Implementation Intelligence</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%F0%9F%94%8E%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="/css/styles.css">
</head>
<body>

<nav class="topnav" id="nav"></nav>

<div class="wrap">
  <div class="breadcrumb" id="breadcrumb"><a href="/">Home</a> / Collections</div>
</div>

<div id="collections-root"></div>

<footer id="footer"></footer>

<script src="/js/common.js"></script>
<script>
  CII.renderNav('Collections');
  CII.renderFooter();

  const id = CII.getParam('id');
  const root = document.getElementById('collections-root');

  CII.loadData().then(({ records, collections }) => {
    if (id) {
      const collection = collections.find((c) => c.id === id);
      if (!collection) {
        root.innerHTML = '<div class="wrap"><div class="empty-state"><h2>Collection not found</h2><a class="btn-primary" href="/collections.html">All collections</a></div></div>';
        return;
      }
      document.title = `${collection.title} — Company Implementation Intelligence`;
      document.getElementById('breadcrumb').innerHTML = `<a href="/">Home</a> / <a href="/collections.html">Collections</a> / ${CII.escapeHtml(collection.title)}`;
      CII.track('collection_viewed', { id: collection.id });

      const items = collection.record_ids.map((rid) => records.find((r) => r.id === rid)).filter(Boolean);
      root.innerHTML = `
        <section class="section" style="padding-top:16px; border-bottom:none;">
          <div class="wrap">
            <div class="eyebrow">Collection</div>
            <h2 style="font-family:var(--serif); font-size:28px; margin:0 0 10px;">${CII.escapeHtml(collection.title)}</h2>
            <p style="color:var(--ink-soft); max-width:640px; margin-bottom:28px;">${CII.escapeHtml(collection.description)}</p>
            <div class="card-grid" id="collection-cards"></div>
          </div>
        </section>
      `;
      const grid = document.getElementById('collection-cards');
      grid.innerHTML = items.map(CII.recordCardHtml).join('') || '<p class="no-results">No records in this collection yet.</p>';
      CII.wireCardEvents(grid);
      return;
    }

    // List all collections
    root.innerHTML = `
      <section class="section" style="padding-top:16px; border-bottom:none;">
        <div class="wrap">
          <div class="eyebrow">Curated</div>
          <h2 style="font-family:var(--serif); font-size:28px; margin:0 0 20px;">Collections</h2>
          <div class="card-grid" id="all-collections"></div>
        </div>
      </section>
    `;
    const grid = document.getElementById('all-collections');
    grid.innerHTML = collections.map((c) => `
      <div class="collection-card">
        <h3>${CII.escapeHtml(c.title)}</h3>
        <p>${CII.escapeHtml(c.description)}</p>
        <span class="count">${c.record_ids.length} example${c.record_ids.length === 1 ? '' : 's'}</span>
        <a class="btn-secondary" style="margin-top:8px; align-self:flex-start;" href="/collections.html${CII.qs({ id: c.id })}">View collection &rarr;</a>
      </div>
    `).join('');
  });
</script>
</body>
</html>
